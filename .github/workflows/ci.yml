name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  policy:
    name: PR policy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|perf|refactor|docs|test|build|ci|chore)(\([a-z0-9-]+\))?!?:\ .+ ]]; then
            echo "Use Conventional Commits format for the PR title."
            exit 1
          fi

  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12
      - name: Install locked dependencies
        run: bun ci
      - name: Verify
        run: bun run verify
      - name: Package cPanel release
        if: github.event_name == 'push'
        run: |
          bun scripts/package-cpanel.ts
          printf '%s\n' "$GITHUB_SHA" > dist/cpanel/.nordic-release
      - name: Install FTPS client
        if: github.event_name == 'push'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lftp
      - name: Deploy to cPanel
        if: github.event_name == 'push'
        env:
          CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          set -Eeuo pipefail

          : "${CPANEL_FTP_PASSWORD:?Missing CPANEL_FTP_PASSWORD repository secret}"

          readonly ftp_host='ftp://dubai90.server.ae'
          readonly ftp_user='deploy@nordicsolutions.ae'
          readonly stage='.nordic_deploy_next'
          readonly previous='public_html_previous'
          readonly failed='.nordic_deploy_failed'

          ftp_run() {
            lftp -u "${ftp_user},${CPANEL_FTP_PASSWORD}" "$ftp_host" -e "
          set cmd:fail-exit true;
          set net:max-retries 2;
          set net:timeout 15;
          set ftp:ssl-force true;
          set ftp:ssl-protect-data true;
          set ssl:verify-certificate true;
          $1
          bye
          "
          }

          ftp_exists() {
            ftp_run "cls -1 $1 > /dev/null;"
          }

          ftp_release() {
            ftp_run 'cat public_html/.nordic-release;'
          }

          for required in index.html en.html ar.html privacy.html terms.html .htaccess api/contact.php; do
            test -f "dist/cpanel/$required"
          done

          ftp_run "
          rm -r -f ${stage};
          mirror --reverse --delete --parallel=4 dist/cpanel ${stage};
          cls -1 ${stage}/index.html > /dev/null;
          cls -1 ${stage}/en.html > /dev/null;
          cls -1 ${stage}/ar.html > /dev/null;
          cls -1 ${stage}/.htaccess > /dev/null;
          cls -1 ${stage}/api/contact.php > /dev/null;
          "

          if ! ftp_run "
          rm -r -f ${previous};
          mv public_html ${previous};
          mv ${stage} public_html;
          "; then
            echo "Activation command failed; checking the live release before rollback." >&2
          fi

          live_release="$(ftp_release 2>/dev/null | tr -d '\r\n' || true)"
          if [[ "$live_release" != "$GITHUB_SHA" ]]; then
            echo "Deployment activation failed; restoring the previous release." >&2

            if ftp_exists "${previous}/index.html"; then
              if ftp_exists 'public_html/index.html'; then
                ftp_run "
                rm -r -f ${failed};
                mv public_html ${failed};
                mv ${previous} public_html;
                rm -r -f ${failed};
                "
              else
                ftp_run "mv ${previous} public_html;"
              fi
            fi

            exit 1
          fi

          for url in \
            'https://nordicsolutions.ae/' \
            'https://nordicsolutions.ae/en' \
            'https://nordicsolutions.ae/ar'; do
            curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --max-time 20 "$url" > /dev/null
          done

          for url in \
            'https://nordicsolutions.ae/privacy' \
            'https://nordicsolutions.ae/terms'; do
            curl --fail --silent --show-error --retry 3 --retry-all-errors \
              --max-time 20 "$url" > /dev/null
          done

          contact_status="$(
            curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --max-time 20 'https://nordicsolutions.ae/api/contact'
          )"
          test "$contact_status" = '405'
